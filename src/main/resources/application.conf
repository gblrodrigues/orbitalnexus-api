ktor {
  deployment {
    port = 8080
    host = "0.0.0.0"
    port = ${?PORT}
  }
  application {
    modules = [
      com.gblrod.orbitalnexus.plugins.DatabaseKt.configureDatabase
      com.gblrod.orbitalnexus.plugins.KoinKt.configureKoin
      com.gblrod.orbitalnexus.plugins.SerializationKt.configureSerialization
      com.gblrod.orbitalnexus.plugins.StatusPagesKt.configureStatusPages
      com.gblrod.orbitalnexus.plugins.RoutingKt.configureRouting
      com.gblrod.orbitalnexus.plugins.SwaggerKt.configureSwagger
    ]
  }
}

database {
    url = ${?DATABASE_URL}
    driver = ${?DATABASE_DRIVER}
    user = ${?DATABASE_USER}
    password = ${?DATABASE_PASSWORD}
}

app {
    publicBaseUrl = "http://localhost:8080"
    publicBaseUrl = ${?PUBLIC_BASE_URL}
}